<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#59636c"/></marker><marker id="blueArrow" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#315f8d"/></marker><marker id="greenArrow" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#5f8178"/></marker><marker id="redArrow" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#a15e50"/></marker><style>.cn{font-family:Microsoft YaHei, Noto Sans CJK SC, SimSun, sans-serif;}</style></defs><rect width="1800" height="820" fill="#ffffff"/><text x="900" y="35" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:31px;font-weight:650;fill:#27313a">图谱驱动的任务上下文生成流水线</text><text x="900" y="73" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:20px;font-weight:400;fill:#59636c">在 Token 预算 B 约束下，生成任务相关、结构连贯的最小充分上下文</text><rect x="70" y="230" width="255" height="120" rx="10" fill="#fff" stroke="#aab4bb" stroke-width="2"/><text x="197.5" y="274.02" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:26px;font-weight:650;fill:#27313a">任务描述 q</text><text x="197.5" y="306.02" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:18px;font-weight:400;fill:#59636c">Token 预算 B</text><line x1="325" y1="290" x2="375" y2="290" stroke="#59636c" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="230" width="255" height="120" rx="10" fill="#eef4f8" stroke="#7396b1" stroke-width="3"/><text x="527.5" y="274.02" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:26px;font-weight:650;fill:#315f8d">锚点选择</text><text x="527.5" y="306.02" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:18px;font-weight:400;fill:#59636c">向量检索 + 映射</text><line x1="655" y1="290" x2="705" y2="290" stroke="#59636c" stroke-width="3" marker-end="url(#arrow)"/><rect x="730" y="230" width="255" height="120" rx="10" fill="#fff" stroke="#aab4bb" stroke-width="2"/><text x="857.5" y="274.02" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:26px;font-weight:650;fill:#27313a">子图裁剪</text><text x="857.5" y="306.02" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:18px;font-weight:400;fill:#59636c">加权双向 BFS</text><line x1="985" y1="290" x2="1035" y2="290" stroke="#59636c" stroke-width="3" marker-end="url(#arrow)"/><rect x="1060" y="230" width="255" height="120" rx="10" fill="#fff" stroke="#aab4bb" stroke-width="2"/><text x="1187.5" y="274.02" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:26px;font-weight:650;fill:#27313a">骨架抽取</text><text x="1187.5" y="306.02" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:18px;font-weight:400;fill:#59636c">距离感知分级</text><line x1="1315" y1="290" x2="1365" y2="290" stroke="#59636c" stroke-width="3" marker-end="url(#arrow)"/><rect x="1390" y="230" width="255" height="120" rx="10" fill="#eef5f2" stroke="#5f8178" stroke-width="3"/><text x="1517.5" y="274.02" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:26px;font-weight:650;fill:#5f8178">符号化序列化</text><text x="1517.5" y="306.02" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:18px;font-weight:400;fill:#59636c">输出上下文 C</text><line x1="1395" y1="350" x2="1395" y2="424" stroke="#59636c" stroke-width="2.5" marker-end="url(#arrow)"/><polygon points="1395,424 1475,490 1395,556 1315,490" fill="#fff" stroke="#aab4bb" stroke-width="2"/><text x="1395" y="478" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:19px;font-weight:650;fill:#27313a">tokens(C)</text><text x="1395" y="510" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:19px;font-weight:650;fill:#27313a">≤ B ?</text><rect x="1515" y="445" width="215" height="90" rx="10" fill="#eef5f2" stroke="#5f8178" stroke-width="2"/><text x="1622.5" y="474.63" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:23px;font-weight:650;fill:#5f8178">输出上下文 C</text><text x="1622.5" y="504.63" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:17px;font-weight:400;fill:#59636c">交付给智能体</text><path d="M1475 490 H1515" fill="none" stroke="#5f8178" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#greenArrow)"/><text x="1490" y="462" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:17px;font-weight:650;fill:#5f8178">是</text><rect x="1160" y="625" width="340" height="92" rx="10" fill="#fbf0ee" stroke="#a15e50" stroke-width="2"/><text x="1330" y="645.26" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:24px;font-weight:650;fill:#a15e50">五级降级链</text><text x="1330" y="675.76" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:17px;font-weight:400;fill:#59636c">降压缩档 → 减节点 → 减深度</text><text x="1330" y="696.5" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:17px;font-weight:400;fill:#59636c">→ 提边权 → 仅保留锚点</text><path d="M1395 556 V625" fill="none" stroke="#a15e50" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#redArrow)"/><text x="1430" y="592" text-anchor="start" dominant-baseline="middle" class="" style="font-size:17px;font-weight:650;fill:#a15e50">否 / 超预算</text><path d="M1160 671 H900 V350" fill="none" stroke="#a15e50" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#redArrow)"/><text x="1000" y="648" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:17px;font-weight:650;fill:#a15e50">重新执行子图裁剪与骨架抽取</text><rect x="80" y="740" width="1640" height="48" rx="8" fill="#f7f9fa" stroke="#aab4bb" stroke-width="1.5"/><text x="900" y="764" text-anchor="middle" dominant-baseline="middle" class="" style="font-size:17px;font-weight:400;fill:#59636c">系统级降级：向量索引缺失 → 结构检索；图谱缺失 → 文件系统提示；序列化失败 → 输出锚点清单</text></svg>