<svg xmlns="http://www.w3.org/2000/svg" width="1770" height="1511" viewBox="0 0 1770 1511" role="img"><title>看板加载同构数据，复用阶段门禁并通过当前数据源持久化状态</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L11,6 L0,12 Z" fill="#303840"/></marker><marker id="erArrow" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,10 L0,20 Z" fill="#303840"/></marker><marker id="open" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#303840" stroke-width="2"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#303840;font-weight:400} .label{paint-order:stroke;stroke:#fff;stroke-width:9px;stroke-linejoin:round}</style></defs><rect width="1770" height="1511" fill="#fff"/>
<polyline points="180,135 180,1481" fill="none" stroke="#737d86" stroke-width="2" stroke-dasharray="9 6"/>
<polyline points="650,135 650,1481" fill="none" stroke="#737d86" stroke-width="2" stroke-dasharray="9 6"/>
<polyline points="1120,135 1120,1481" fill="none" stroke="#737d86" stroke-width="2" stroke-dasharray="9 6"/>
<polyline points="1590,135 1590,1481" fill="none" stroke="#737d86" stroke-width="2" stroke-dasharray="9 6"/>
<text x="415" y="180" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">打开工作流看板</text>
<polyline points="180,207 650,207" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<text x="885" y="256" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">请求需求列表与详情</text>
<polyline points="650,283 1120,283" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1355" y="332" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">按配置读取 mock 或 API</text>
<polyline points="1120,359 1590,359" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1355" y="408" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">返回需求状态</text>
<polyline points="1590,435 650,435" fill="none" stroke="#303840" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/>
<text x="415" y="484" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">点击阶段节点</text>
<polyline points="180,511 650,511" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<text x="765" y="560" font-size="31" font-weight="400" text-anchor="start" dominant-baseline="central">按 Schema 判定门禁</text>
<polyline points="650,587 740,587 740,621 650,621" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#open)"/>
<rect x="30" y="644" width="1710" height="809" fill="none" stroke="#737d86" stroke-width="2"/>
<rect x="30" y="644" width="76" height="42" fill="#fff" stroke="#303840" stroke-width="2"/>
<text x="68" y="665" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="central">alt</text>
<text x="135" y="672" font-size="29" font-weight="600" text-anchor="start" dominant-baseline="central">[门禁未通过]</text>
<text x="415" y="712" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">提示缺失前置</text>
<polyline points="650,739 180,739" fill="none" stroke="#303840" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/>
<polyline points="30,793 1740,793" fill="none" stroke="#737d86" stroke-width="2" stroke-dasharray="9 6"/>
<text x="135" y="852" font-size="29" font-weight="600" text-anchor="start" dominant-baseline="central">[门禁通过]</text>
<text x="415" y="892" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">提交阶段操作</text>
<polyline points="180,919 650,919" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<text x="885" y="968" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">提交状态变更</text>
<polyline points="650,995 1120,995" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1355" y="1044" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">浏览器保存或 CLI 原子更新</text>
<polyline points="1120,1071 1590,1071" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1355" y="1120" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">返回新状态</text>
<polyline points="1590,1147 1120,1147" fill="none" stroke="#303840" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/>
<text x="885" y="1196" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">返回更新结果</text>
<polyline points="1120,1223 650,1223" fill="none" stroke="#303840" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/>
<text x="765" y="1272" font-size="31" font-weight="400" text-anchor="start" dominant-baseline="central">记录快照并刷新 DAG</text>
<polyline points="650,1299 740,1299 740,1333 650,1333" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#open)"/>
<text x="415" y="1372" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">展示新状态</text>
<polyline points="650,1399 180,1399" fill="none" stroke="#303840" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/>
<rect x="20" y="25" width="320" height="110" fill="#fff" stroke="#303840" stroke-width="2"/>
<text x="180" y="80" font-size="35" font-weight="400" text-anchor="middle" dominant-baseline="central">开发者</text>
<rect x="490" y="25" width="320" height="110" fill="#fff" stroke="#303840" stroke-width="2"/>
<text x="650" y="57.25" font-size="35" font-weight="400" text-anchor="middle" dominant-baseline="central">工作流看板</text>
<text x="650" y="102.75" font-size="35" font-weight="400" text-anchor="middle" dominant-baseline="central">阶段操作抽屉</text>
<rect x="960" y="25" width="320" height="110" fill="#fff" stroke="#303840" stroke-width="2"/>
<text x="1120" y="57.25" font-size="35" font-weight="400" text-anchor="middle" dominant-baseline="central">数据访问层</text>
<text x="1120" y="102.75" font-size="35" font-weight="400" text-anchor="middle" dominant-baseline="central">fetcher</text>
<rect x="1430" y="25" width="320" height="110" fill="#fff" stroke="#303840" stroke-width="2"/>
<text x="1590" y="57.25" font-size="35" font-weight="400" text-anchor="middle" dominant-baseline="central">数据源</text>
<text x="1590" y="102.75" font-size="35" font-weight="400" text-anchor="middle" dominant-baseline="central">mock / 本地服务</text>
</svg>