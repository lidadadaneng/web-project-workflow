<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="780" viewBox="0 0 2100 780" role="img"><title>阶段制品依次经过准备、生成和收尾三个阶段</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L11,6 L0,12 Z" fill="#303840"/></marker><marker id="erArrow" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,10 L0,20 Z" fill="#303840"/></marker><marker id="open" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#303840" stroke-width="2"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#303840;font-weight:400} .label{paint-order:stroke;stroke:#fff;stroke-width:9px;stroke-linejoin:round}</style></defs><rect width="2100" height="780" fill="#fff"/>
<rect x="30" y="35" width="630" height="680" fill="none" stroke="#737d86" stroke-width="2" stroke-dasharray="10 7"/>
<text x="56" y="62" font-size="38" font-weight="600" text-anchor="start" dominant-baseline="central" class="label">准备</text>
<rect x="735" y="35" width="630" height="680" fill="none" stroke="#737d86" stroke-width="2" stroke-dasharray="10 7"/>
<text x="761" y="62" font-size="38" font-weight="600" text-anchor="start" dominant-baseline="central" class="label">生成</text>
<rect x="1440" y="35" width="630" height="680" fill="none" stroke="#737d86" stroke-width="2" stroke-dasharray="10 7"/>
<text x="1466" y="62" font-size="38" font-weight="600" text-anchor="start" dominant-baseline="central" class="label">收尾</text>
<rect x="70" y="285" width="215" height="105" fill="#fff" stroke="#303840" stroke-width="2"/>
<text x="177.5" y="337.5" font-size="34" font-weight="400" text-anchor="middle" dominant-baseline="central">检查依赖</text>
<polygon points="390,278 472.5,338 390,398 307.5,338" fill="#fff" stroke="#303840" stroke-width="2"/>
<text x="390" y="338" font-size="29" font-weight="600" text-anchor="middle" dominant-baseline="central">可继续？</text>
<rect x="490" y="285" width="140" height="105" fill="#fff" stroke="#303840" stroke-width="2"/>
<text x="560" y="318" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="central">模板与</text>
<text x="560" y="357" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="central">前序制品</text>
<polyline points="285,338 307,338" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="473,338 490,338" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="303" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="central" class="label">是</text>
<rect x="245" y="535" width="290" height="95" fill="#fff" stroke="#303840" stroke-width="2"/>
<text x="390" y="582.5" font-size="32" font-weight="400" text-anchor="middle" dominant-baseline="central">提示缺失前置</text>
<polyline points="390,398 390,535" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<text x="425" y="465" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="central">否</text>
<rect x="775" y="285" width="220" height="105" fill="#fff" stroke="#303840" stroke-width="2"/>
<text x="885" y="337.5" font-size="34" font-weight="400" text-anchor="middle" dominant-baseline="central">生成草稿</text>
<polygon points="1090,278 1172.5,338 1090,398 1007.5,338" fill="#fff" stroke="#303840" stroke-width="2"/>
<text x="1090" y="338" font-size="30" font-weight="600" text-anchor="middle" dominant-baseline="central">确认？</text>
<rect x="1190" y="285" width="145" height="105" fill="#fff" stroke="#303840" stroke-width="2"/>
<text x="1262.5" y="337.5" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">确认制品</text>
<polyline points="995,338 1007,338" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1173,338 1190,338" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1182" y="303" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="central" class="label">是</text>
<polyline points="1090,398 1090,535 885,535 885,390" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<text x="985" y="568" font-size="29" font-weight="400" text-anchor="middle" dominant-baseline="central">修改意见</text>
<rect x="1475" y="285" width="170" height="105" fill="#fff" stroke="#303840" stroke-width="2"/>
<text x="1560" y="337.5" font-size="33" font-weight="400" text-anchor="middle" dominant-baseline="central">保存文档</text>
<rect x="1690" y="285" width="170" height="105" fill="#fff" stroke="#303840" stroke-width="2"/>
<text x="1775" y="337.5" font-size="33" font-weight="400" text-anchor="middle" dominant-baseline="central">更新状态</text>
<rect x="1905" y="285" width="130" height="105" fill="#fff" stroke="#303840" stroke-width="2"/>
<text x="1970" y="337.5" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">返回结果</text>
<polyline points="1645,338 1690,338" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1860,338 1905,338" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="630,338 775,338" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1335,338 1475,338" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
</svg>