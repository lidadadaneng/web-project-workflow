<text x="1355" y="1034" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">保存确认后的文档</text>
<polyline points="650,1061 1590,1061" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<text x="885" y="1110" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">标记阶段完成</text>
<polyline points="650,1137 1120,1137" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1355" y="1186" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">原子更新状态</text>
<polyline points="1120,1213 1590,1213" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<text x="885" y="1262" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">返回新状态</text>
