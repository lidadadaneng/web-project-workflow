<polyline points="650,871 180,871" fill="none" stroke="#303840" stroke-width="2" marker-end="url(#arrow)"/>
<text x="415" y="920" font-size="31" font-weight="400" text-anchor="middle" dominant-baseline="central">确认或提出修改</text>
